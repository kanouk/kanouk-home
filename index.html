<style>

      --fg: #e8e8e6;
      --muted: #86868b;
      --faint: #6a6a6e;
      --link: #8fabff;
      --icon: #77777c;
      --c-github: #ffffff;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  ::selection { background: rgba(91, 121, 214, 0.22); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-feature-settings: "palt";
    background: var(--bg);
    color: var(--fg);
    line-height: 1.85;
    padding: 6.5rem 1.6rem 5rem;
  }
  main { max-width: 32rem; margin: 0 auto; }

  header {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  header img {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: block;
  }
  h1 {
    font-size: 1.35rem;
    font-weight: 650;
    letter-spacing: 0.015em;
  }

  h2 {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 3.2rem;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--faint);
  }
  h2 svg { width: 0.9rem; height: 0.9rem; fill: var(--faint); }

  .icons {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    margin-top: 1.1rem;
  }
  .icons a, li a.icon-link { display: inline-flex; padding: 0.1rem; }
  .icons svg, li svg {
    width: 1.3rem; height: 1.3rem;
    fill: var(--icon);
    transition: fill 0.18s ease, transform 0.18s ease;
  }
  li svg { width: 1.15rem; height: 1.15rem; }
  .icons a:hover svg, li a.icon-link:hover svg { transform: translateY(-1px); }
  a.i-blog:hover svg      { fill: var(--link); }
  a.i-github:hover svg    { fill: var(--c-github); }
  a.i-x:hover svg         { fill: var(--c-x); }
  a.i-facebook:hover svg  { fill: #0866FF; }
  a.i-instagram:hover svg { fill: #E4405F; }
  a.i-smugmug:hover svg   { fill: #6DB944; }
  a.i-mail:hover svg      { fill: #EA4335; }
  a.i-youtube:hover svg   { fill: #FF0000; }
  a.i-spotify:hover svg   { fill: #1ED760; }
  a.i-note:hover svg      { fill: var(--c-x); }

  ul { list-style: none; margin-top: 1rem; }
  li {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    margin-bottom: 0.9rem;
    font-size: 0.95rem;
  }
  .work-name { font-weight: 600; letter-spacing: 0.01em; }
  a {
    color: var(--link);
    text-decoration: none;
  }
  a:hover { text-decoration: underline; text-underline-offset: 0.25em; text-decoration-thickness: 1px; }
  li a.icon-link:hover { text-decoration: none; }
  a:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 3px;
    border-radius: 4px;
  }
</style>
