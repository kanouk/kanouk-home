<style>
  :root {
    --bg: #fffffe;
    --fg: #1a1a1a;
    --muted: #767672;
    --link: #1a56c4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --fg: #e8e8e6;
      --muted: #8f8f8c;
      --link: #82aaff;
    }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;

    color: var(--fg);
    line-height: 1.9;
    padding: 5.5rem 1.5rem 4rem;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.02em; }
  .tagline { color: var(--muted); font-size: 0.95rem; margin-top: 0.3rem; }
  ul { list-style: none; margin-top: 2.8rem; }
  li { margin-bottom: 0.65rem; font-size: 1rem; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  li span { color: var(--muted); font-size: 0.88rem; }
  footer { margin-top: 4.5rem; font-size: 0.8rem; color: var(--muted); }

</head>
