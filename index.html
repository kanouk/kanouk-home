<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="カノ（kanouk）のホーム。つくったものの置き場と各リンク。">
<title>kanouk.com</title>
<style>
  :root {
    --bg: #fafaf8;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2563eb;
    --card: #ffffff;
    --border: #e5e5e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --fg: #e8e8e6;
      --muted: #9a9a97;
      --accent: #7aa2f7;
      --card: #1f1f24;
      --border: #2e2e34;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.7;
    padding: 4rem 1.5rem;
  }
  main { max-width: 560px; margin: 0 auto; }
  .mark {
    width: 3.2rem; height: 3.2rem;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; font-weight: 700;
    margin-bottom: 1.2rem;
  }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.01em; }
  .handle { color: var(--muted); font-size: 0.92rem; margin-top: 0.1rem; }
  .bio { color: var(--muted); font-size: 0.95rem; margin: 1.1rem 0 2.6rem; }
  ul { list-style: none; }
  li { margin-bottom: 0.9rem; }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    text-decoration: none;
    color: var(--fg);
    transition: border-color 0.15s;
  }
  a.card:hover { border-color: var(--accent); }
  a.card .title { font-weight: 600; color: var(--accent); }
  a.card .desc { font-size: 0.86rem; color: var(--muted); margin-top: 0.15rem; }
  footer { margin-top: 3.5rem; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="mark">カ</div>
  <h1>カノ</h1>
  <div class="handle">@kanouk</div>
  <p class="bio">つくって、続けて、置いておく。ここはその置き場の入口です。</p>
  <ul>
    <li>
      <a class="card" href="https://www.youtube.com/@perfumeradio">
        <div class="title">香水ラジオ（YouTube）</div>
        <div class="desc">香水を毎日1本ずつ紹介するラジオ。連続配信中</div>
      </a>
    </li>
    <li>
      <a class="card" href="https://perfume-radio.jp/">
        <div class="title">香水ラジオ（サイト）</div>
        <div class="desc">全アーカイブと香水データベース</div>
      </a>
    </li>
    <li>
      <a class="card" href="https://kanolog.net/">
        <div class="title">ブログ kanolog</div>
        <div class="desc">日々の楽しみ、アート、サイエンス、雑記</div>
      </a>
    </li>
    <li>
      <a class="card" href="https://pages.kanouk.com/">
        <div class="title">公開ドキュメント</div>
        <div class="desc">ハンズオン資料などの置き場</div>
      </a>
    </li>
    <li>
      <a class="card" href="https://github.com/kanouk">
        <div class="title">GitHub</div>
        <div class="desc">つくっているもの</div>
      </a>
    </li>
  </ul>
  <footer>kanouk.com</footer>
</main>
</body>
</html>
